<text x="1228" y="853" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#213b2d" text-anchor="start">REGLAS DEL MODELO</text>
<text x="1228" y="883" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#213b2d" text-anchor="start">• Usuario.rol: admin | usuario</text>
<text x="1228" y="903" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#213b2d" text-anchor="start">• El registro crea usuarios.</text>
<text x="1228" y="923" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#213b2d" text-anchor="start">• Precio entero en céntimos.</text>
<text x="1228" y="943" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#213b2d" text-anchor="start">• Una venta por jugador.</text>
<text x="1228" y="963" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#213b2d" text-anchor="start">• Compra atómica y simulada.</text>
<text x="1228" y="983" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#213b2d" text-anchor="start">• Se conserva la ficha vendida.</text>
<text x="1228" y="1003" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#213b2d" text-anchor="start">• La versión evita datos obsoletos.</text>
