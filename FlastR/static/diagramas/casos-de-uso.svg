<ellipse cx="550" cy="227" rx="200.0" ry="33" fill="#fff" stroke="#719365" stroke-width="1.4"/>
<text x="550" y="232.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Explorar y filtrar mercado</text>
<ellipse cx="550" cy="303" rx="200.0" ry="33" fill="#fff" stroke="#719365" stroke-width="1.4"/>
<text x="550" y="308.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Consultar ficha de jugador</text>
<ellipse cx="550" cy="379" rx="200.0" ry="33" fill="#fff" stroke="#719365" stroke-width="1.4"/>
<text x="550" y="384.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Registrarse</text>
<ellipse cx="550" cy="455" rx="200.0" ry="33" fill="#fff" stroke="#719365" stroke-width="1.4"/>
<text x="550" y="460.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Iniciar sesión</text>
<ellipse cx="550" cy="531" rx="200.0" ry="33" fill="#fff" stroke="#719365" stroke-width="1.4"/>
<text x="550" y="536.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Cerrar sesión</text>
<text x="857" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#607b49" text-anchor="start">ACCESO PÚBLICO</text>
<text x="857" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7f5b" text-anchor="start">Todos pueden explorar y consultar fichas.</text>
<text x="857" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7f5b" text-anchor="start">El visitante puede crear una cuenta.</text>
<text x="857" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#607b49" text-anchor="start">SESIONES</text>
<text x="857" y="477" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7f5b" text-anchor="start">Usuario y administrador acceden con</text>
<text x="857" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7f5b" text-anchor="start">correo y contraseña. El rol determina</text>
<text x="857" y="519" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7f5b" text-anchor="start">qué acciones pueden realizar.</text>
<ellipse cx="550" cy="690" rx="200.0" ry="33" fill="#e7f1d0" stroke="#719365" stroke-width="1.4"/>
<text x="550" y="686.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Comprar jugador</text>
<text x="550" y="704.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">(confirmación simulada)</text>
<ellipse cx="1090" cy="690" rx="177.5" ry="33" fill="#fff" stroke="#719365" stroke-width="1.4"/>
<text x="1090" y="686.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Validar disponibilidad</text>
<text x="1090" y="704.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">y versión del precio</text>
