<text x="550" y="780.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Consultar mis fichajes</text>
<text x="913" y="784" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#678050" text-anchor="start">Precondición: sesión de usuario.</text>
