<text x="550" y="1063.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Agregar jugador</text>
<ellipse cx="550" cy="1138" rx="200.0" ry="33" fill="#fff" stroke="#719365" stroke-width="1.4"/>
<text x="550" y="1143.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Editar jugador disponible</text>
<ellipse cx="550" cy="1218" rx="200.0" ry="33" fill="#fff" stroke="#719365" stroke-width="1.4"/>
<text x="550" y="1223.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Eliminar jugador disponible</text>
<ellipse cx="1090" cy="1098" rx="177.5" ry="33" fill="#fff" stroke="#719365" stroke-width="1.4"/>
<text x="1090" y="1103.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#213b2d" text-anchor="middle">Validar ficha y foto</text>
<path d="M750 1058H827V1088H907" fill="none" stroke="#719365" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M750 1138H827V1108H907" fill="none" stroke="#719365" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="827" y="1050" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#62834b" text-anchor="start">«include»</text>
<text x="827" y="1158" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#62834b" text-anchor="start">«include»</text>
<text x="888" y="964" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#678050" text-anchor="start">Precondición: sesión de administrador.</text>
<text x="888" y="990" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#678050" text-anchor="start">Las publicaciones vendidas se conservan</text>
<text x="888" y="1011" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#678050" text-anchor="start">para mantener el historial de compras.</text>
<text x="242" y="1317" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6c7c61" text-anchor="start">Las compras guardan el historial y retiran la publicación. No existe cobro real ni actor de pagos.</text>
<text x="40" y="1374" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6c7c61" text-anchor="start">«include»: comportamiento obligatorio dentro del caso de uso. Tener el rol y la sesión adecuados es una precondición.</text>
